services:
  api1:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE}
    depends_on:
      - db

  api2:
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE}
    depends_on:
      - db

  api3:
    build: ./api
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE}
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data: